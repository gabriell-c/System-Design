[project]
name = "archia-backend"
version = "0.1.0"
requires-python = ">=3.12"
# Mirror of backend/requirements.txt for what the code actually imports.
# Pinned sources of truth live in requirements.txt / requirements-dev.txt.
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy",
  "pydantic-settings",
  "httpx",
  "pyjwt",
  "bcrypt",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
