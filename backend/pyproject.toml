[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

# Default rule set (E4/E7/E9/F) — matches historical CI green baseline.
# Expand gradually; do not enable B/SIM/I en masse without a cleanup PR.
[tool.ruff.lint]
ignore = []

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]
"alembic/versions/*" = ["E501", "I001", "F401"]
